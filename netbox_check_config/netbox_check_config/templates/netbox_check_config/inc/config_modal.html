{% load static %}

<div class="modal fade" id="configModal" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="configModalLabel">设备配置: <span id="modalDeviceName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <pre id="configContent" class="bg-light p-3 border rounded" style="white-space: pre-wrap; min-height: 200px;"></pre>
                <div id="loadingSpinner" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在抓取配置，请稍候...</p>
                </div>
                <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="copyConfigBtn">复制配置</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const configModal = document.getElementById('configModal');
    const configContent = document.getElementById('configContent');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const errorMessage = document.getElementById('errorMessage');
    const modalDeviceName = document.getElementById('modalDeviceName');
    const copyBtn = document.getElementById('copyConfigBtn');

    window.showDeviceConfig = function(deviceId, deviceName) {
        // 重置状态
        modalDeviceName.textContent = deviceName;
        configContent.textContent = '';
        configContent.classList.add('d-none');
        errorMessage.classList.add('d-none');
        loadingSpinner.classList.remove('d-none');
        
        const modal = new bootstrap.Modal(configModal);
        modal.show();

        // 调用 API
        fetch(`/plugins/check-config/device/${deviceId}/config-api/`)
            .then(response => response.json())
            .then(data => {
                loadingSpinner.classList.add('d-none');
                if (data.success) {
                    configContent.textContent = data.config;
                    configContent.classList.remove('d-none');
                } else {
                    errorMessage.textContent = data.error || '抓取配置失败';
                    errorMessage.classList.remove('d-none');
                }
            })
            .catch(error => {
                loadingSpinner.classList.add('d-none');
                errorMessage.textContent = '网络错误: ' + error;
                errorMessage.classList.remove('d-none');
            });
    };

    copyBtn.addEventListener('click', function() {
        const text = configContent.textContent;
        if (text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制！';
                copyBtn.classList.replace('btn-primary', 'btn-success');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.replace('btn-success', 'btn-primary');
                }, 2000);
            });
        }
    });
});
</script>
