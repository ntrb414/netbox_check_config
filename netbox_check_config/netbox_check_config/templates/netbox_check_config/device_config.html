{% extends 'base/layout.html' %}
{% load static %}

{% block title %}设备配置: {{ device.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col col-md-12">
        <div class="card">
            <h5 class="card-header">
                设备配置: {{ device.name }}
                <div class="card-actions">
                    <button class="btn btn-sm btn-primary" onclick="location.reload()">
                        <i class="mdi mdi-refresh"></i> 刷新
                    </button>
                </div>
            </h5>
            <div class="card-body">
                <pre id="configArea" class="bg-light p-3 border rounded">正在加载配置...</pre>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch(`/plugins/check-config/device/{{ device.pk }}/config-api/`)
        .then(response => response.json())
        .then(data => {
            const area = document.getElementById('configArea');
            if (data.success) {
                area.textContent = data.config;
            } else {
                area.innerHTML = `<div class="text-danger">${data.error}</div>`;
            }
        });
});
</script>
{% endblock %}
