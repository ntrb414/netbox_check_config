{% extends 'base/layout.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <div class="float-end">
                   <a href="{{ device.get_absolute_url }}" class="btn btn-sm btn-outline-secondary">
                       <i class="mdi mdi-arrow-left"></i> 返回设备
                   </a>
                </div>
                <strong>设备配置: {{ device.name }} ({{ device_ip }})</strong>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% elif show_form %}
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card border-primary">
                                <div class="card-header bg-primary text-white">
                                    <i class="mdi mdi-lock-question"></i> SSH 认证信息
                                </div>
                                <div class="card-body">
                                    <form method="post">
                                        {% csrf_token %}
                                        <div class="mb-3">
                                            <label for="username" class="form-label">SSH 用户名</label>
                                            <input type="text" class="form-control" id="username" name="username" required placeholder="请输入SSH登录账号">
                                        </div>
                                        <div class="mb-3">
                                            <label for="password" class="form-label">SSH 密码</label>
                                            <input type="password" class="form-control" id="password" name="password" required placeholder="请输入SSH登录密码">
                                        </div>
                                        <div class="d-grid">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="mdi mdi-cloud-download"></i> 提交并获取配置
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                {% else %}
                    <div class="mb-3">
                        <span class="badge bg-info">使用账号: {{ username }}</span>
                        <span class="badge bg-secondary">IP: {{ device_ip }}</span>
                        <a href="." class="btn btn-sm btn-outline-primary float-end">
                            <i class="mdi mdi-refresh"></i> 重新登录
                        </a>
                    </div>
                    <pre class="bg-dark text-light p-3 rounded" style="max-height: 800px; overflow-y: auto;"><code>{{ config }}</code></pre>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
